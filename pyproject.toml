[project]
name = "assayer"
version = "0.1.0.dev0"
description = "Durable, budget-guarded evals for LLM tasks and conversational agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Assayer contributors" }]
keywords = ["llm", "evaluation", "agents", "llm-as-judge", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
assayer = "assayer.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assayer"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PL", "TID", "ASYNC", "S", "N", "RET", "ARG",
]
ignore = [
    "PLR0913", # too many arguments: ports legitimately take several collaborators
    "PLR2004", # magic values in comparisons
    "S101",    # assert is fine (tests + invariants)
    "N818",    # domain exception names read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG", "N802", "RUF001", "RUF003", "PLC0415"]
# Typer maps parameters to options positionally; registration imports are deliberate side effects.
"src/assayer/cli/**" = ["PLR0917"]
"src/assayer/builtin/__init__.py" = ["PLC0415"]
"scripts/**" = ["E501"]  # inline HTML template

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: talks to a real model endpoint (Ollama); deselected by default",
    "slow: slower tests (subprocess / multiprocess)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["assayer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
]
