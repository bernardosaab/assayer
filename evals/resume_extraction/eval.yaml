name: resume_extraction
kind: task
description: >
  Extract structured facts from a résumé. Gold labels carry two labellers' votes and trap
  values (plausible-but-wrong answers such as a previous employer reported as the current one).

task:
  runner: extraction
  prompt: prompts/system.md
  output_schema: schema.yaml
  args:
    # Numbers come from code: the model extracts a year that is written in the document,
    # and the runner derives years of experience. Asking a small model to do the subtraction
    # failed in practice (it copied the reference year). See docs/hill-climbing.md.
    derive:
      years_experience: {years_since: first_job_start_year, as_of: 2026}

# Deterministic sensors first: they settle what code can settle.
checks:
  - use: field_match
    args: {fields: [name, current_title, current_employer, years_experience]}
  - use: set_f1
    args: {field: skills, threshold: 0.8}
  - use: trap_absent
  - use: grounded
    args: {fields: [name, current_title, current_employer, skills]}

# The model critic second, for what code cannot settle. It quotes or it does not count.
judge:
  criteria:
    - id: no_fabrication
      text: Every value in the EXTRACTED OUTPUT is supported by the SOURCE DOCUMENT.
    - id: current_role
      text: >
        current_title and current_employer describe the person's CURRENT role (the one without
        an end date), not a previous one.
      # A violation must quote the wrong value from the output. Added after a real 7B judge
      # "proved" violations by quoting correct lines of the résumé (docs/hill-climbing.md).
      quote_from: subject
